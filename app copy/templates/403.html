<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Access denied | Sunhaven Care Portal</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 60px auto;
        padding: 20px;
        background: #f4f7fb;
      }

      .denied {
        background: white;
        padding: 30px;
        border-radius: 10px;
        border-left: 7px solid #c62828;
      }

      h1 {
        color: #b71c1c;
      }
    </style>
  </head>
  <body>
    <div class="denied">
      <h1>Access denied</h1>

      <h2>HTTP 403 Forbidden</h2>

      <p>{{ denial_reason }}</p>

      <p><strong>Requested route:</strong> {{ requested_path }}</p>

      <p>
        This denial has been recorded in the sanitized application audit log.
      </p>

      <p>
        <a href="/">Return to home</a>
      </p>
    </div>
  </body>
</html>
